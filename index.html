<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What Creature Are You?</title>
    <style>
        @font-face {
            font-family: 'PixelFont';
            src: url('ProFontWindows.ttf') format('truetype');
        }

        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PixelFont', sans-serif;
            background: #290000;
        }

        .container {
            width: 100vw; /* full viewport width */
            height: calc(100vw * (16 / 9)); /* maintain 9:16 aspect ratio */
            max-height: 150vh; /* full viewport height */
            max-width: calc(100vh * (9 / 16));
            padding: 20px;
            border-radius: 10px;
            background: #290000;
            /* background: #e5f2d2; */
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /* overflow-y: auto;   */
        }

        .title {
            font-size: 48px;
            color: #f74d19;
        }
        .subtitle {
            font-size: 24px;
            color: #f74d19;
            /* border: 0.5px solid #f74d19; */
            margin-bottom: 3vh;
        }

        .start-button {
            font-size: 36px;
            padding: 1vh 2vw;
            /* border: 2px solid #fcf0c0; */
            background-color: #290000;
            color: #f74d19;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 3vh;
        }

        .start-button:hover {
            background-color: #f74d19;
            color: #290000;
        }

        .game-container {
            display: none;
            margin-top: 10%;
            overflow: auto;
        }
 
        .choices {
        
        display: flex;
        flex-direction: column; /* Arrange buttons in a column */
        align-items: center; /* Center the buttons horizontally */
        gap: 10px; /* Space between the buttons */
        margin-top: 2rem; /* Space above the choices container */
        }

        .choice-button {
            font-family: 'PixelFont', sans-serif;
            font-size: 18px; /* Adjust font size to be smaller */
            padding: 1vh 1vw; /* Adjust padding based on viewport height and width */
            border: 0.5px solid #290000; /* Border color */
            background-color: #290000; /* White background */
            cursor: pointer; /* Pointer cursor on hover */
            transition: background-color 0.3s, transform 0.3s; /* Smooth transitions */
            width: 80%; /* Make buttons take up 80% of the container's width */
            font-size: 24px;
            color: #f74d19;
            text-align: left;
        }

        @media (hover: hover) {
            .choice-button:hover {
                background-color: #f74d19;
                color: #290000;
            }
        }
        .choice-button:focus {
            background-color: #f74d19;
            color: #290000;
        }
        .story-text {
            font-size: 32px;
            margin-bottom: 1px; /* Space above the choices container */
            padding: 1rem;
            border: 0.5px solid #f74d19; /* Border color */
            color: #f74d19;
            text-align: left;
        /* padding-bottom: 5rem; */
        }

        .image-container {
            max-width: 70%; /* Set max width of image container */
            margin: 0 auto; /* Center the image horizontally */
        }

        .image-container img {
            width: 100%; /* Make the image fill its container */
            height: auto; /* Maintain aspect ratio */
            display: block; /* Remove any extra space */
            max-width: 100%; /* Ensure image does not exceed its container */
        }

        .responsive-image {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">What creature are you?</div>
        <div class="subtitle">(based on all the little guys ania sends me...)</div>
        <a href="#" class="start-button" onclick="startGame()">Start</a>
        
        <div class="game-container" id="game-container">
            <div class ="story-text" id="story-text"></div>
            <div class="choices" id="choices"></div>
        </div>

    </div>
    
    <script src="js/mainGame.js">
    
    </script>
    
    <script async defer src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif" alt="" referrerpolicy="no-referrer-when-downgrade" /></noscript>

</body> 
</html>
